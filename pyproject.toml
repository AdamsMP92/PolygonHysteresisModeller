[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "polygon-hysteresis-modeller"
version = "0.1.0"
description = "Generate synthetic polygonal hysteresis curves."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["numpy", "scipy", "matplotlib>=3.5"]

[tool.setuptools.packages.find]
where = ["src"]

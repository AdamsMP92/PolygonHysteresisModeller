[workspace]
name = "polygon-hysteresis-modeller"
channels = ["conda-forge"]
platforms = ["osx-arm64", "osx-64", "linux-64", "win-64"]

[dependencies]
python = "3.12.*"

[pypi-dependencies]
polygon-hysteresis-modeller = { path = ".", editable = true }
mammos-analysis = "*"
mammos-entity = "*"
mammos-units = "*"
notebook = "*"

[tasks]
notebooks = "jupyter notebook notebooks/examples.ipynb"
